name: Simple Python CI/CD

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка pytest
        run: pip install pytest

      - name: Запуск тестов
        run: pytest -v

      - name: Сборка приложения
        run: |
          mkdir build
          cp main.py build/
          zip -r app.zip build/

      - name: Сохранение артефакта
        uses: actions/upload-artifact@v4
        with:
          name: my-application
          path: app.zip
